<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Lý Robot 20/10 - Gửi Người Thương</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b, #090d16);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #f3f4f6;
        }

        /* Khung điện thoại cố định rõ ràng, đảm bảo hiển thị 100% */
        .phone-frame {
            width: 390px;
            max-width: 100vw;
            height: 92vh;
            max-height: 820px;
            background: #111827;
            border-radius: 36px;
            border: 7px solid #262f40;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 77, 141, 0.25);
        }

        @media (max-width: 450px) {
            .phone-frame {
                width: 100vw;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }

        /* Thanh trạng thái */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #9ca3af;
            background: #111827;
            z-index: 5;
        }

        .heart-battery {
            color: #ff4d8d;
            font-weight: bold;
        }

        /* Khu vực hiển thị Robot */
        .bot-stage {
            height: 245px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 60%, rgba(0, 242, 254, 0.14), transparent 70%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            flex-shrink: 0;
            z-index: 5;
        }

        .bot-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid rgba(0, 242, 254, 0.35);
            color: #00f2fe;
            margin-bottom: 8px;
        }

        /* Nhân vật Robot */
        .robot-wrapper {
            position: relative;
            width: 140px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            animation: floatBot 3s ease-in-out infinite;
        }

        .antenna {
            width: 4px;
            height: 16px;
            background: #94a3b8;
            position: relative;
        }
        .antenna::after {
            content: '❤';
            position: absolute;
            top: -16px;
            left: -6px;
            color: #ff4d8d;
            font-size: 15px;
            text-shadow: 0 0 8px #ff4d8d;
        }

        .robot-head {
            width: 112px;
            height: 78px;
            background: linear-gradient(145deg, #f8fafc, #cbd5e1);
            border-radius: 28px;
            padding: 9px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.45);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ear {
            position: absolute;
            width: 9px;
            height: 26px;
            background: #ff4d8d;
            border-radius: 5px;
            top: 26px;
        }
        .ear.left { left: -6px; }
        .ear.right { right: -6px; }

        .face-screen {
            width: 100%;
            height: 100%;
            background: #090d16;
            border-radius: 20px;
            border: 2px solid #334155;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .eyes-row {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .eye {
            width: 15px;
            height: 19px;
            background: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe;
            transition: all 0.2s;
        }

        .robot-wrapper.blink .eye {
            height: 3px;
            border-radius: 2px;
        }

        .robot-wrapper.happy .eye {
            background: transparent;
            box-shadow: none;
            width: 17px;
            height: 10px;
            border-top: 4px solid #00f2fe;
            border-radius: 50% 50% 0 0;
        }

        .robot-wrapper.love .eye {
            background: transparent;
            box-shadow: none;
            width: auto;
            height: auto;
        }
        .robot-wrapper.love .eye::before {
            content: '❤';
            font-size: 18px;
            color: #ff4d8d;
            text-shadow: 0 0 10px #ff4d8d;
        }

        .cheeks {
            position: absolute;
            width: 78%;
            display: flex;
            justify-content: space-between;
            top: 36px;
        }
        .cheek {
            width: 12px;
            height: 6px;
            background: #ff4d8d;
            border-radius: 50%;
            opacity: 0.7;
        }

        .voice-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 10px;
            margin-top: 6px;
        }
        .wave-bar {
            width: 3px;
            height: 3px;
            background: #00f2fe;
            border-radius: 2px;
        }
        .robot-wrapper.speaking .wave-bar {
            animation: speakWave 0.35s infinite alternate;
        }
        .robot-wrapper.speaking .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .robot-wrapper.speaking .wave-bar:nth-child(3) { animation-delay: 0.2s; }

        .robot-body {
            width: 64px;
            height: 42px;
            background: linear-gradient(145deg, #f8fafc, #cbd5e1);
            border-radius: 14px 14px 24px 24px;
            margin-top: 4px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core-heart {
            font-size: 15px;
            color: #ff4d8d;
            animation: pulse 1s infinite;
        }

        .arm {
            position: absolute;
            width: 13px;
            height: 30px;
            background: #cbd5e1;
            border-radius: 8px;
            top: 6px;
            transition: all 0.4s;
        }
        .arm.left { left: -11px; transform: rotate(15deg); }
        .arm.right { right: -11px; transform: rotate(-15deg); }

        .flower-prop {
            position: absolute;
            right: -34px;
            top: -10px;
            font-size: 24px;
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s;
        }

        .robot-wrapper.give-flower .arm.right {
            transform: rotate(-65deg);
        }
        .robot-wrapper.give-flower .flower-prop {
            opacity: 1;
            transform: scale(1.1);
        }

        .pet-hint {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Khu vực tin nhắn */
        .chat-area {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 5;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: popIn 0.25s ease forwards;
        }
        .msg-row.bot { align-self: flex-start; }
        .msg-row.user { align-self: flex-end; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg-row.bot .msg-bubble {
            background: #1f2937;
            color: #f3f4f6;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .msg-row.user .msg-bubble {
            background: linear-gradient(135deg, #ff4d8d, #ff758c);
            color: #fff;
            border-bottom-right-radius: 4px;
            font-weight: 600;
        }

        .special-card {
            background: rgba(255, 77, 141, 0.14);
            border: 1px solid rgba(255, 77, 141, 0.45);
            border-radius: 14px;
            padding: 12px;
            margin-top: 6px;
        }
        .special-card h4 {
            color: #00f2fe;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .love-timer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #ff8da1;
            background: rgba(0,0,0,0.35);
            padding: 7px;
            border-radius: 8px;
            text-align: center;
        }

        /* Nút trả lời */
        .reply-bar {
            padding: 12px 14px 18px;
            background: #111827;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 70px;
            align-items: center;
            z-index: 5;
        }

        .reply-btn {
            background: rgba(255, 77, 141, 0.18);
            border: 1.5px solid #ff4d8d;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 13.5px;
            padding: 9px 16px;
            border-radius: 22px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reply-btn:hover {
            background: #ff4d8d;
        }

        @keyframes floatBot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes speakWave {
            0% { height: 3px; }
            100% { height: 11px; }
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Thanh trạng thái -->
        <div class="status-bar">
            <span id="clock">20:10</span>
            <div>
                <span>Hazard-Telecom </span>
                <span class="heart-battery">❤ 100%</span>
            </div>
        </div>

        <!-- Khu vực Trợ lý Robot -->
        <div class="bot-stage">
            <div class="bot-badge" id="bot-status-text">TRỢ LÝ HazardAI v20.10</div>

            <div class="robot-wrapper" id="robot" onclick="petRobot()">
                <div class="antenna"></div>
                <div class="robot-head">
                    <div class="ear left"></div>
                    <div class="ear right"></div>
                    <div class="face-screen">
                        <div class="eyes-row" id="eyes-row">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="cheeks">
                            <div class="cheek"></div>
                            <div class="cheek"></div>
                        </div>
                        <div class="voice-wave">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>
                </div>
                <div class="robot-body">
                    <div class="arm left"></div>
                    <div class="core-heart">❤</div>
                    <div class="arm right"></div>
                    <div class="flower-prop">🌹</div>
                </div>
            </div>

            <div class="pet-hint" id="pet-hint">(Chạm vào đầu HazardAI để cưng nựng nhé!)</div>
        </div>

        <!-- Khu vực Chat -->
        <div class="chat-area" id="chat-area"></div>

        <!-- Khu vực nút bấm trả lời -->
        <div class="reply-bar" id="reply-bar"></div>
    </div>

    <script>
        /* =====================================================
           SỬA TÊN NGƯỜI YÊU & LỜI CHÚC TẠI ĐÂY:
           ===================================================== */
        const CONFIG = {
            tenNguoiYeu: "Bà chã hơm",
            tenBan: "HazardNguyen",
            ngayBatDauYeu: "2022-11-22", // Năm-Tháng-Ngày
            loiChuc20_10: `Chúc mừng ngày 20/10 bà chã hơm tuyệt vời nhất! ❤️<br><br>
                Cậu chủ nhỏ bảo mình nhắn rằng: Dù cậu chủ nhỏ khô khan, suốt ngày chỉ biết đến code và máy móc, nhưng trong bộ nhớ của cậu ấy thì <b>100% dung lượng</b> đều dành riêng cho em.<br><br>
                Chúc bà chã hơm luôn rạng rỡ, hạnh phúc và mãi là nguồn năng lượng ấm áp nhất của ông chã húi nhé!`,
            monQuaBiMat: "🎟️ 1 nụ hôn kiểu pháp + cú đá lốc xoáy + Ôm không giới hạn!"
        };

        const DIALOG_STEPS = {
            start: {
                mood: "happy",
                status: "ĐANG KẾT NỐI TRÁI TIM...",
                messages: [
                    "Bíp bíp! 🤖 Hệ thống khởi động thành công!",
                    `Xin chào <b>${CONFIG.tenNguoiYeu}</b>! Mình là <b>HazardAI</b> — trợ lý AI riêng do <b>${CONFIG.tenBan}</b> lập trình chỉ để gửi tới bạn vào ngày 20/10 hôm nay.`
                ],
                options: [
                    { text: "Chào HazardAI nha! Đáng yêu thế 🥰", next: "step_scan" },
                    { text: "Ủa Cậu chủ nhỏ dặn HazardAI nói gì đó? 👀", next: "step_scan" }
                ]
            },
            step_scan: {
                mood: "normal",
                status: "ĐANG QUÉT ĐỘ XINH ĐẸP...",
                messages: [
                    "Khoan đã nhé! Trước khi mở dữ liệu bí mật, mình cần quét cảm biến để xác nhận danh tính người thương của cậu chủ nhỏ... 🔍",
                    "⚡ <b>CẢNH BÁO:</b> Phát hiện chỉ số dễ thương vượt ngưỡng cho phép tới 2010%! Mạch điện của mình sắp chập vì độ xinh đẹp này rồi!"
                ],
                options: [
                    { text: "HazardAI khéo nịnh giống ông chã húi rồi đó 😆", next: "step_diagnostic" },
                    { text: "Haha, xác nhận chuẩn 100% rồi đó!", next: "step_diagnostic" }
                ]
            },
            step_diagnostic: {
                mood: "happy",
                status: "BÁO CÁO TÌNH TRẠNG CẬU CHỦ",
                messages: [
                    "Mình vừa kiểm tra hệ thống của cậu chủ và phát hiện 3 lỗi nghiêm trọng không thể vá được:",
                    `1️⃣ <b>CPU não bộ:</b> Luôn chạy 100% công suất vì nhớ <b>${CONFIG.tenNguoiYeu}</b>.<br>
                     2️⃣ <b>Cảm biến ánh nhìn:</b> Chỉ tự động lấy nét mỗi khi thấy bạn cười.<br>
                     3️⃣ <b>Trái tim:</b> Đã bị bạn nắm giữ toàn quyền điều khiển!
                     <div class="special-card">
                        <h4>⏱️ THỜI GIAN BÊN NHAU:</h4>
                        <div class="love-timer" id="live-timer">Đang tính toán...</div>
                     </div>`
                ],
                options: [
                    { text: "Báo cáo này nghe ngọt xỉu luôn á 💓", next: "step_flower" }
                ]
            },
            step_flower: {
                mood: "love",
                giveFlower: true,
                status: "GIAO THỨC TRAO HOA 20/10 🌹",
                messages: [
                    "Tèn ten! Cánh tay robot của mình mang theo bông hoa hồng không bao giờ tàn dành tặng bạn nè! 🌹✨",
                    `<div class="special-card">
                        <h4>💌 THƯ TỪ ${CONFIG.tenBan.toUpperCase()}:</h4>
                        <p>${CONFIG.loiChuc20_10}</p>
                    </div>`
                ],
                options: [
                    { text: "Cảm ơn anh và bé HazardAI nhiều lắm! ❤️", next: "step_gift" }
                ]
            },
            step_gift: {
                mood: "love",
                giveFlower: true,
                status: "HOÀN TẤT NHIỆM VỤ YÊU THƯƠNG 💖",
                messages: [
                    "Trong bộ nhớ của mình còn cất giữ một Phiếu Đặc Quyền 20/10 mà cậu chủ đã ký duyệt sẵn:",
                    `<div class="special-card">
                        <h4>🎁 VOUCHER ĐẶC QUYỀN 20/10:</h4>
                        <p style="font-weight:700; color:#fff;">${CONFIG.monQuaBiMat}</p>
                        <p style="font-size:12px; color:#9ca3af; margin-top:5px;">(Chụp màn hình gửi cho ${CONFIG.tenBan} để nhận quà ngay nhé!)</p>
                    </div>`
                ],
                options: [
                    { text: "Xem lại từ đầu 🔄", next: "start_reset" }
                ]
            }
        };

        const robotEl = document.getElementById('robot');
        const chatArea = document.getElementById('chat-area');
        const replyBar = document.getElementById('reply-bar');
        const botStatusText = document.getElementById('bot-status-text');
        const petHint = document.getElementById('pet-hint');
        let petCount = 0;

        function setRobotMood(mood, giveFlower = false) {
            robotEl.className = 'robot-wrapper';
            if (mood && mood !== 'normal') robotEl.classList.add(mood);
            if (giveFlower) robotEl.classList.add('give-flower');
        }

        function petRobot() {
            petCount++;
            robotEl.classList.add('love');
            petHint.innerHTML = `Đã xoa đầu HazardAI <b>${petCount}</b> lần! HazardAI thích lắm 🥰`;
            setTimeout(() => robotEl.classList.remove('love'), 1200);
        }

        const sleep = (ms) => new Promise(res => setTimeout(res, ms));

        function appendUserMessage(text) {
            const row = document.createElement('div');
            row.className = 'msg-row user';
            row.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function appendBotMessage(htmlContent) {
            robotEl.classList.add('speaking');
            await sleep(700);
            robotEl.classList.remove('speaking');

            const row = document.createElement('div');
            row.className = 'msg-row bot';
            row.innerHTML = `<div class="msg-bubble">${htmlContent}</div>`;
            chatArea.appendChild(row);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function runStep(stepKey) {
            if (stepKey === 'start_reset') {
                chatArea.innerHTML = '';
                runStep('start');
                return;
            }
            const step = DIALOG_STEPS[stepKey];
            if (!step) return;

            replyBar.innerHTML = '';
            botStatusText.textContent = step.status;
            setRobotMood(step.mood, step.giveFlower);

            for (const msg of step.messages) {
                await appendBotMessage(msg);
                await sleep(250);
            }

            step.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'reply-btn';
                btn.innerHTML = opt.text;
                btn.onclick = () => {
                    appendUserMessage(opt.text);
                    runStep(opt.next);
                };
                replyBar.appendChild(btn);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        setInterval(() => {
            const now = new Date();
            const timerEl = document.getElementById('live-timer');
            if (timerEl) {
                const start = new Date(CONFIG.ngayBatDauYeu);
                const diff = Math.max(0, now - start);
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((diff / 1000 / 60) % 60);
                const secs = Math.floor((diff / 1000) % 60);
                timerEl.innerHTML = `<b>${days}</b> ngày : <b>${hours}</b> giờ : <b>${mins}</b> phút : <b>${secs}</b> giây`;
            }
        }, 1000);

        // Chạy ngay lập tức
        runStep('start');
    </script>
</body>
</html>
